version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - revive
    - unconvert
    - unparam

  settings:
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: context-as-argument

  exclusions:
    rules:
      # Table driven tests shadow names and build throwaway structs freely.
      - path: _test\.go
        linters:
          - unparam

formatters:
  enable:
    - gofmt
